<!DOCTYPE html>
<html>
<head>
    <title>AI Driven Dyslexia Detection System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container">
        <a class="navbar-brand project-title" href="/">
        AI Driven Dyslexia Detection System
    </a>
        <div>
            {% if session.get('user') %}
                <a href="/dashboard" class="btn btn-light btn-sm">Dashboard</a>
                <a href="/logout" class="btn btn-danger btn-sm">Logout</a>
            {% else %}
                <a href="/login" class="btn btn-light btn-sm">Login</a>
                <a href="/register" class="btn btn-success btn-sm">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<div class="container mt-5">
    {% with messages = get_flashed_messages() %}
        {% if messages %}
            <div class="alert alert-warning">
                {% for msg in messages %}{{ msg }}{% endfor %}
            </div>
        {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
</div>

</body>
</html>
