{% extends "layout.html" %}
{% block content %}
<div class="overlay-card col-md-6 mx-auto">
<h3 class="text-center">Register</h3>
<form method="POST">
<input type="text" name="name" placeholder="Full Name" class="form-control mb-2" required>
<input type="text" name="username" placeholder="Username" class="form-control mb-2" required>
<input type="password" name="password" placeholder="Password" class="form-control mb-2" required>
<input type="email" name="email" placeholder="Email" class="form-control mb-2" required>
<input type="text" name="mobile" placeholder="Mobile Number" class="form-control mb-3" required>
<button class="btn btn-success w-100">Register</button>
</form>
</div>
{% endblock %}
